<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Assinatura de Notas · Rotele</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --dark:#232326; --dark2:#3a3a3c; --orange:#fcb040; --orange2:#f39c12;
    --bg:#f0f0f2; --card:#ffffff;
    --text:#232326; --muted:#6c6c70; --danger:#c0392b; --ok:#2e7d32;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);}
  header{
    background:#ffffff;color:var(--text);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 10px rgba(0,0,0,.08);border-bottom:1px solid #ececee;
  }
  header .brand{display:flex;align-items:center;gap:12px;}
  header img.logo{height:34px;width:auto;display:block;}
  header .title-block{border-left:1px solid #dcdce0;padding-left:12px;}
  header h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.2px;color:var(--dark);}
  header .sub{font-size:10.5px;color:var(--muted);margin-top:2px;}
  header button{
    background:#fff;border:1.5px solid #dcdce0;color:var(--dark2);
    border-radius:8px;padding:7px 12px;font-size:12px;font-weight:600;
  }
  main{max-width:480px;margin:0 auto;padding:22px 16px 70px;}
  .card{background:var(--card);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 14px rgba(30,30,32,.08);border:1px solid #ececee;}
  label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.3px;color:var(--muted);text-transform:uppercase;margin:12px 0 5px;}
  input[type=text],input[type=password],select,textarea{
    width:100%;padding:12px 13px;border:1.5px solid #dcdce0;border-radius:10px;font-size:15px;background:#fafafa;
    transition:border-color .15s,background .15s;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);background:#fff;}
  textarea{resize:vertical;min-height:60px;}
  button.primary{
    width:100%;margin-top:18px;background:linear-gradient(135deg,var(--orange) 0%,var(--orange2) 100%);
    color:#2a2a2c;border:none;padding:14px;border-radius:11px;font-size:15px;font-weight:700;
    box-shadow:0 3px 10px rgba(243,156,18,.35);letter-spacing:.2px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  button.primary:active{transform:translateY(1px);}
  button.primary:disabled{opacity:.4;box-shadow:none;}
  button.secondary{
    width:100%;margin-top:10px;background:#fff;color:var(--dark2);border:1.5px solid #dcdce0;
    padding:12px;border-radius:11px;font-size:14px;font-weight:600;
  }
  button.link{background:none;border:none;color:var(--dark2);font-size:13px;font-weight:600;text-decoration:none;padding:6px 0;border-bottom:1.5px solid transparent;}
  button.link:hover{border-bottom-color:var(--orange);}
  .error{color:var(--danger);font-size:13px;margin-top:8px;font-weight:600;}
  .note-item{border:1px solid #ececee;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;background:#fff;transition:box-shadow .15s;}
  .note-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .note-item .name{font-size:14.5px;font-weight:700;}
  .note-item .meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:34px 10px;}
  .pdf-wrap{position:relative;border:1.5px solid #e2e2e5;border-radius:12px;overflow:hidden;touch-action:manipulation;box-shadow:inset 0 0 0 1px #fff;}
  .pdf-wrap canvas{width:100%;display:block;}
  .marker{width:16px;height:16px;background:var(--orange);border:2.5px solid var(--dark);border-radius:50%;box-shadow:0 0 0 4px rgba(252,176,64,.3);}
  .marker{position:absolute;transform:translate(-50%,-50%);}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;}
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}
  .status-pill{font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:4px 10px;border-radius:20px;background:#e9f5ea;color:var(--ok);}
  #app{display:none;}
  .hidden{display:none !important;}
  .checkbox-row{display:flex;align-items:center;gap:9px;padding:10px 12px;background:#faf6ef;border:1px solid #f0e2c8;border-radius:10px;margin-top:12px;}
  .checkbox-row input{width:auto;}
  .checkbox-row span{font-size:13px;color:var(--text);font-weight:500;}
  .fila-badge{display:inline-block;background:var(--dark2);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:8px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <img class="logo" src="logo.png" alt="Grupo Rotele">
    <div class="title-block">
      <h1>Assinatura de Notas</h1>
      <div class="sub">Distribuidor Ambev MS</div>
    </div>
  </div>
  <button id="btnSair" class="hidden" onclick="sair()">Sair</button>
</header>

<main>

  <!-- LOGIN -->
  <section id="viewLogin" class="card">
    <label>Usuário</label>
    <input type="text" id="loginUsuario" autocomplete="username">
    <label>Senha</label>
    <input type="password" id="loginSenha" autocomplete="current-password">
    <button class="primary" onclick="fazerLogin()">Entrar</button>
    <div id="loginErro" class="error hidden"></div>
  </section>

  <div id="app">

    <!-- ADMIN: UPLOAD -->
    <section id="viewAdmin" class="card hidden">
      <label>Selecionar notas (PDF) — pode escolher várias</label>
      <input type="file" id="arquivoPdf" accept="application/pdf" multiple>
      <button class="primary" id="btnUpload" onclick="subirNota()" disabled>Subir nota(s)</button>
      <div id="uploadMsg" class="hint"></div>
      <button class="link" style="margin-top:14px;" onclick="mostrarMinhasNotas()">Ver minhas notas &rarr;</button>
    </section>

    <!-- ADMIN: ACOMPANHAMENTO -->
    <section id="viewMinhasNotas" class="card hidden">
      <button class="link" onclick="mostrar('viewAdmin')">&larr; voltar</button>
      <strong style="display:block;margin:10px 0;">Minhas notas</strong>
      <div id="listaMinhasNotas"></div>
      <button class="link" onclick="carregarMinhasNotas()">Atualizar lista</button>
    </section>

    <!-- OPERACIONAL: LISTA -->
    <section id="viewLista" class="hidden">
      <div class="card">
        <strong>Notas pendentes de assinatura</strong>
        <div id="listaNotas" style="margin-top:12px;"></div>
        <button class="link" onclick="carregarPendentes()">Atualizar lista</button>

        <div id="barraLote" class="hidden">
          <label style="margin-top:16px;">Ao assinar as selecionadas</label>
          <select id="modoLote">
            <option value="mesmo">Usar a mesma placa/centro de custo em todas</option>
            <option value="individual">Preencher cada nota separadamente</option>
          </select>
          <button class="primary" onclick="iniciarFila()">
            Assinar selecionadas (<span id="qtdSelecionadas">0</span>)
          </button>
        </div>
      </div>
    </section>

    <!-- OPERACIONAL: ASSINAR -->
    <section id="viewAssinar" class="card hidden">
      <button class="link" onclick="cancelarFila()">&larr; voltar</button>
      <div id="badgeFila" class="fila-badge hidden"></div>
      <div class="pdf-wrap" id="pdfWrap" style="margin-top:10px;">
        <canvas id="pdfCanvas"></canvas>
        <div id="marker" class="marker hidden"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
        <button class="link" onclick="paginaAnterior()">&larr; Anterior</button>
        <span id="infoPagina" class="hint" style="margin:0;">Página 1 de 1</span>
        <button class="link" onclick="paginaProxima()">Próxima &rarr;</button>
      </div>
      <button class="link" onclick="abrirEmTelaCheia()">Ver PDF em tela cheia (leitor do celular)</button>
      <div class="hint">Toque no PDF no local onde o recado deve aparecer.</div>

      <label class="checkbox-row" style="margin-top:14px;text-transform:none;">
        <input type="checkbox" id="replicarTodasPaginas" checked onchange="onMudarReplicar()">
        <span>Aplicar o mesmo carimbo em todas as páginas</span>
      </label>
      <div class="hint" id="hintReplicar">Desmarque pra escolher, página a página, onde o carimbo vai (útil quando cada página precisa de um recado diferente).</div>

      <label>Placa</label>
      <input type="text" id="campoPlaca" placeholder="Ex: ABC1D23" style="text-transform:uppercase;">
      <label>C.C CUSTO</label>
      <select id="campoCentroCusto">
        <option value="Entrega">Entrega</option>
        <option value="Puxada">Puxada</option>
        <option value="Armazém">Armazém</option>
      </select>
      <label>Recado (opcional)</label>
      <textarea id="campoRecado" placeholder="Observação adicional" style="text-transform:uppercase;"></textarea>

      <button class="primary" id="btnConfirmarAssinatura" onclick="confirmarAssinatura()" disabled>
        Assinar nota
      </button>
      <div id="assinarMsg" class="hint"></div>
    </section>

  </div>
</main>

<script>
// ⚠️ Troque pela URL do seu Apps Script Web App (Implantar > Nova implantação)
const API_URL = 'https://script.google.com/macros/s/AKfycbysrZ4GtFGZGXLAnlT-547PlGrJp9V-HiiJ0g7DHNMf6OA2ars0kxZP86ivseGhChb5EA/exec';

let sessao = null; // {usuario, senha, perfil, nome}
let notaAtual = null;
let pdfOriginalBytes = null;
let pdfjsDocAtual = null;
let numPaginas = 1;
let paginaAtual = 1;
let pontosPorPagina = {};  // usado quando "replicar" está desmarcado: {numPagina: {x,y}}
let pontoUnico = null;     // usado quando "replicar" está marcado
let canvasScale = 1;
let ultimoRenderScale = 1;
let ultimaAlturaPdf = 1;
let notasSelecionadas = new Set();
let filaAssinatura = [];
let filaIndice = 0;
let filaModoMesmo = false;
let filaDadosCompartilhados = null;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

function mostrar(id) {
  document.querySelectorAll('main section').forEach(s => s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

async function api(action, payload, method) {
  if (method === 'GET') {
    const params = new URLSearchParams({ action, ...payload }).toString();
    const res = await fetch(API_URL + '?' + params);
    return res.json();
  }
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action, ...payload })
  });
  return res.json();
}

async function fazerLogin() {
  const usuario = document.getElementById('loginUsuario').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const erroEl = document.getElementById('loginErro');
  erroEl.classList.add('hidden');

  if (!usuario || !senha) return;

  const r = await api('login', { usuario, senha }, 'POST');
  if (!r.ok) {
    erroEl.textContent = 'Usuário ou senha inválidos.';
    erroEl.classList.remove('hidden');
    return;
  }

  sessao = { usuario, senha, perfil: r.perfil, nome: r.nome };
  document.getElementById('viewLogin').classList.add('hidden');
  document.getElementById('app').style.display = 'block';
  document.getElementById('btnSair').classList.remove('hidden');

  if (sessao.perfil === 'admin') {
    mostrar('viewAdmin');
  } else {
    mostrar('viewLista');
    carregarPendentes();
  }
}

function sair() {
  sessao = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('btnSair').classList.add('hidden');
  document.getElementById('loginSenha').value = '';
  mostrar('viewLogin');
}

// ---------- ADMIN: UPLOAD ----------
document.getElementById('arquivoPdf').addEventListener('change', (e) => {
  document.getElementById('btnUpload').disabled = !e.target.files.length;
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function subirNota() {
  const input = document.getElementById('arquivoPdf');
  const files = Array.from(input.files);
  if (!files.length) return;
  const msg = document.getElementById('uploadMsg');
  const btn = document.getElementById('btnUpload');
  btn.disabled = true;

  let sucesso = 0, falha = 0;
  for (let i = 0; i < files.length; i++) {
    msg.textContent = `Enviando ${i + 1} de ${files.length}...`;
    const base64 = await fileToBase64(files[i]);
    const r = await api('upload', {
      usuario: sessao.usuario, senha: sessao.senha,
      filename: files[i].name, base64
    }, 'POST');
    if (r.ok) sucesso++; else falha++;
  }

  msg.textContent = falha
    ? `${sucesso} nota(s) enviada(s), ${falha} com erro.`
    : `${sucesso} nota(s) enviada(s) com sucesso.`;
  input.value = '';
  btn.disabled = true;
}

// ---------- ADMIN: MINHAS NOTAS ----------
function mostrarMinhasNotas() {
  mostrar('viewMinhasNotas');
  carregarMinhasNotas();
}

function fmtData(d) {
  if (!d) return '';
  const dt = new Date(d);
  return isNaN(dt) ? d : dt.toLocaleString('pt-BR');
}

async function carregarMinhasNotas() {
  const box = document.getElementById('listaMinhasNotas');
  box.innerHTML = '<div class="hint">Carregando...</div>';
  const r = await api('listAll', { usuario: sessao.usuario, senha: sessao.senha }, 'GET');
  if (!r.ok) {
    box.innerHTML = '<div class="error">' + (r.erro || 'Erro ao carregar') + '</div>';
    return;
  }
  if (!r.notas.length) {
    box.innerHTML = '<div class="empty">Nenhuma nota enviada ainda.</div>';
    return;
  }
  box.innerHTML = '';
  r.notas.forEach(n => {
    const assinado = n.status === 'Assinado';
    const el = document.createElement('div');
    el.className = 'note-item';
    el.style.flexDirection = 'column';
    el.style.alignItems = 'stretch';
    el.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div class="name">${n.nomeArquivo}</div>
          <div class="meta">
            ${assinado
              ? `Assinado por ${n.assinadoPor} em ${fmtData(n.dataAssinatura)}<br>Placa: ${n.placa || '-'} · C.C CUSTO: ${n.centroCusto || '-'}`
              : `Subido em ${fmtData(n.dataUpload)}`}
          </div>
        </div>
        <span class="status-pill" style="${assinado ? '' : 'background:#fff3e0;color:#b26a00;'}">${n.status}</span>
      </div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button class="link" data-act="baixar">Baixar PDF</button>
        <button class="link" data-act="excluir" style="color:#c0392b;">Excluir</button>
      </div>
    `;
    el.querySelector('[data-act=baixar]').onclick = () => baixarNota(n.id, n.nomeArquivo);
    el.querySelector('[data-act=excluir]').onclick = () => excluirNota(n.id);
    box.appendChild(el);
  });
}

async function baixarNota(id, nomeArquivo) {
  const r = await api('getFile', { id, usuario: sessao.usuario, senha: sessao.senha }, 'GET');
  if (!r.ok) { alert('Erro ao baixar: ' + (r.erro || '')); return; }
  const link = document.createElement('a');
  link.href = 'data:application/pdf;base64,' + r.base64;
  link.download = nomeArquivo || 'nota.pdf';
  link.click();
}

async function excluirNota(id) {
  if (!confirm('Excluir esta nota definitivamente? Essa ação não pode ser desfeita.')) return;
  const r = await api('delete', { usuario: sessao.usuario, senha: sessao.senha, noteId: id }, 'POST');
  if (r.ok) {
    carregarMinhasNotas();
  } else {
    alert('Erro ao excluir: ' + (r.erro || ''));
  }
}

// ---------- OPERACIONAL: LISTA ----------
async function carregarPendentes() {
  const box = document.getElementById('listaNotas');
  box.innerHTML = '<div class="hint">Carregando...</div>';
  notasSelecionadas = new Set();
  atualizarBarraLote();
  const r = await api('listPending', { usuario: sessao.usuario, senha: sessao.senha }, 'GET');
  if (!r.ok || !r.notas.length) {
    box.innerHTML = '<div class="empty">Nenhuma nota pendente.</div>';
    document.getElementById('barraLote').classList.add('hidden');
    return;
  }
  box.innerHTML = '';
  r.notas.forEach(n => {
    const el = document.createElement('div');
    el.className = 'note-item';
    el.innerHTML = `
      <label style="display:flex;align-items:center;gap:10px;margin:0;flex:1;text-transform:none;">
        <input type="checkbox" style="width:auto;" data-sel="${n.id}">
        <div>
          <div class="name">${n.nomeArquivo}</div>
          <div class="meta">Subido por ${n.subidoPor}</div>
        </div>
      </label>
      <span class="status-pill">Pendente</span>
    `;
    el.querySelector('[data-sel]').addEventListener('click', (ev) => {
      ev.stopPropagation();
      if (ev.target.checked) notasSelecionadas.add(n.id); else notasSelecionadas.delete(n.id);
      atualizarBarraLote();
    });
    el.querySelector('.name').onclick = () => abrirNota(n);
    box.appendChild(el);
  });
}

function atualizarBarraLote() {
  const barra = document.getElementById('barraLote');
  const qtd = notasSelecionadas.size;
  document.getElementById('qtdSelecionadas').textContent = qtd;
  barra.classList.toggle('hidden', qtd < 2);
}

async function iniciarFila() {
  const r = await api('listPending', { usuario: sessao.usuario, senha: sessao.senha }, 'GET');
  if (!r.ok) return;
  filaAssinatura = r.notas.filter(n => notasSelecionadas.has(n.id));
  filaIndice = 0;
  filaModoMesmo = document.getElementById('modoLote').value === 'mesmo';
  filaDadosCompartilhados = null;
  abrirProximaDaFila();
}

function abrirProximaDaFila() {
  if (filaIndice >= filaAssinatura.length) {
    filaAssinatura = [];
    voltarLista();
    return;
  }
  abrirNota(filaAssinatura[filaIndice]);
}

function cancelarFila() {
  filaAssinatura = [];
  voltarLista();
}

function voltarLista() {
  mostrar('viewLista');
  carregarPendentes();
}

// ---------- OPERACIONAL: ASSINAR ----------
async function abrirNota(nota) {
  notaAtual = nota;
  pontosPorPagina = {};
  pontoUnico = null;
  paginaAtual = 1;
  document.getElementById('marker').classList.add('hidden');
  document.getElementById('btnConfirmarAssinatura').disabled = true;
  document.getElementById('assinarMsg').textContent = '';
  document.getElementById('replicarTodasPaginas').checked = true;
  onMudarReplicar();

  const emFila = filaAssinatura.length > 0;
  const badge = document.getElementById('badgeFila');
  if (emFila) {
    badge.textContent = `Nota ${filaIndice + 1} de ${filaAssinatura.length}`;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }

  if (emFila && filaModoMesmo && filaDadosCompartilhados) {
    document.getElementById('campoPlaca').value = filaDadosCompartilhados.placa;
    document.getElementById('campoCentroCusto').value = filaDadosCompartilhados.centroCusto;
    document.getElementById('campoRecado').value = filaDadosCompartilhados.recado;
  } else {
    document.getElementById('campoPlaca').value = '';
    document.getElementById('campoRecado').value = '';
  }

  mostrar('viewAssinar');

  const r = await api('getFile', { id: nota.id, usuario: sessao.usuario, senha: sessao.senha }, 'GET');
  if (!r.ok) {
    document.getElementById('assinarMsg').textContent = 'Erro ao carregar PDF.';
    return;
  }

  const binary = atob(r.base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  pdfOriginalBytes = bytes;

  await carregarDocumento(bytes);
}

function abrirEmTelaCheia() {
  if (!pdfOriginalBytes) return;
  const blob = new Blob([pdfOriginalBytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank');
}

function onMudarReplicar() {
  const replicar = document.getElementById('replicarTodasPaginas').checked;
  document.getElementById('hintReplicar').style.display = replicar ? 'none' : 'block';
  desenharMarkerAtual();
  atualizarBotaoConfirmar();
}

function atualizarInfoPagina() {
  document.getElementById('infoPagina').textContent = `Página ${paginaAtual} de ${numPaginas}`;
}

async function paginaAnterior() {
  if (paginaAtual <= 1) return;
  paginaAtual--;
  await renderPaginaAtual();
}

async function paginaProxima() {
  if (paginaAtual >= numPaginas) return;
  paginaAtual++;
  await renderPaginaAtual();
}

function atualizarBotaoConfirmar() {
  const replicar = document.getElementById('replicarTodasPaginas').checked;
  const habilitado = replicar ? !!pontoUnico : Object.keys(pontosPorPagina).length > 0;
  document.getElementById('btnConfirmarAssinatura').disabled = !habilitado;
}

function desenharMarkerAtual() {
  const marker = document.getElementById('marker');
  const replicar = document.getElementById('replicarTodasPaginas').checked;
  const ponto = replicar ? pontoUnico : pontosPorPagina[paginaAtual];
  if (!ponto) { marker.classList.add('hidden'); return; }

  const canvas = document.getElementById('pdfCanvas');
  const xCanvas = ponto.x * ultimoRenderScale;
  const yCanvas = (ultimaAlturaPdf - ponto.y) * ultimoRenderScale;
  marker.style.left = (xCanvas / canvas.width * 100) + '%';
  marker.style.top = (yCanvas / canvas.height * 100) + '%';
  marker.classList.remove('hidden');
}

async function carregarDocumento(bytes) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  pdfjsDocAtual = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
  numPaginas = pdfjsDocAtual.numPages;
  paginaAtual = 1;
  await renderPaginaAtual();
}

async function renderPaginaAtual() {
  const page = await pdfjsDocAtual.getPage(paginaAtual);
  atualizarInfoPagina();

  const wrap = document.getElementById('pdfWrap');
  const targetWidth = wrap.clientWidth || 400;
  const unscaled = page.getViewport({ scale: 1 });
  canvasScale = targetWidth / unscaled.width; // escala usada nas contas de toque (CSS px)
  const dpr = window.devicePixelRatio || 1;
  const renderScale = canvasScale * Math.max(dpr, 2); // reforço extra de nitidez
  const viewport = page.getViewport({ scale: renderScale });

  ultimoRenderScale = renderScale;
  ultimaAlturaPdf = unscaled.height;

  const canvas = document.getElementById('pdfCanvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;

  canvas.onclick = (ev) => {
    const rect = canvas.getBoundingClientRect();
    const xCanvas = (ev.clientX - rect.left) * (canvas.width / rect.width);
    const yCanvas = (ev.clientY - rect.top) * (canvas.height / rect.height);

    // converte para coordenadas do PDF (origem embaixo à esquerda)
    const pdfX = xCanvas / renderScale;
    const pdfY = unscaled.height - (yCanvas / renderScale);
    const ponto = { x: pdfX, y: pdfY };

    const replicar = document.getElementById('replicarTodasPaginas').checked;
    if (replicar) { pontoUnico = ponto; } else { pontosPorPagina[paginaAtual] = ponto; }

    desenharMarkerAtual();
    atualizarBotaoConfirmar();
  };

  desenharMarkerAtual();
}

function linhasCarimbo(nome, placa, centroCusto, recado) {
  const linhas = [
    `ASSINADO DE FORMA DIGITAL POR ${nome.toUpperCase()}`,
    `PLACA: ${placa || '-'}   C.C CUSTO: ${centroCusto.toUpperCase()}`
  ];
  if (recado) linhas.push(recado);
  linhas.push(`DADOS: ${new Date().toLocaleString('pt-BR').toUpperCase()}`);
  return linhas;
}

async function confirmarAssinatura() {
  const replicar = document.getElementById('replicarTodasPaginas').checked;
  if (replicar && !pontoUnico) return;
  if (!replicar && !Object.keys(pontosPorPagina).length) return;

  const msg = document.getElementById('assinarMsg');
  msg.textContent = 'Processando...';
  document.getElementById('btnConfirmarAssinatura').disabled = true;

  const placa = document.getElementById('campoPlaca').value.trim().toUpperCase();
  const centroCusto = document.getElementById('campoCentroCusto').value.toUpperCase();
  const recado = document.getElementById('campoRecado').value.trim().toUpperCase();

  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.load(pdfOriginalBytes);
  const paginas = doc.getPages();
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const linhas = linhasCarimbo(sessao.nome, placa, centroCusto, recado);

  function carimbarPagina(page, ponto) {
    let y = ponto.y;
    linhas.forEach((linha, i) => {
      const ehData = i === linhas.length - 1;
      page.drawText(linha, {
        x: ponto.x, y,
        size: ehData ? 8 : 10,
        font,
        color: ehData ? rgb(0.42,0.42,0.44) : rgb(0.15,0.15,0.16)
      });
      y -= 13;
    });
  }

  if (replicar) {
    paginas.forEach((page) => carimbarPagina(page, pontoUnico));
  } else {
    Object.keys(pontosPorPagina).forEach((numPagina) => {
      const idx = parseInt(numPagina, 10) - 1;
      if (paginas[idx]) carimbarPagina(paginas[idx], pontosPorPagina[numPagina]);
    });
  }

  const finalBytes = await doc.save();
  let binary = '';
  finalBytes.forEach(b => binary += String.fromCharCode(b));
  const base64 = btoa(binary);

  const r = await api('sign', {
    usuario: sessao.usuario, senha: sessao.senha,
    noteId: notaAtual.id, base64, placa, centroCusto, recado
  }, 'POST');

  if (r.ok) {
    if (filaAssinatura.length > 0 && filaModoMesmo) {
      filaDadosCompartilhados = { placa, centroCusto, recado };
    }
    if (filaAssinatura.length > 0) {
      msg.textContent = 'Nota assinada. Abrindo a próxima...';
      filaIndice++;
      setTimeout(abrirProximaDaFila, 700);
    } else {
      msg.textContent = 'Nota assinada com sucesso.';
      setTimeout(voltarLista, 900);
    }
  } else {
    msg.textContent = 'Erro: ' + (r.erro || 'falha ao assinar');
    document.getElementById('btnConfirmarAssinatura').disabled = false;
  }
}
</script>
